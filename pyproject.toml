[project]
name = "pai-quadruped-motion"
version = "0.1.0"
description = "Codex-guided, bounded motion sequences for a quadruped robot"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
sim = [
    "mujoco==3.3.7",
    "numpy==2.2.6",
    "onnxruntime==1.23.2",
    "imageio==2.37.0",
    "imageio-ffmpeg==0.6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
